[package]
name = "tweet-db-server"
version = "0.1.0"
edition = "2024"

[dependencies]
aws-config = "1.8.10"
aws-credential-types = "1.2.8"
aws-sdk-s3 = "1.115.0"
axum = "0.8.8"
axum-extra = { version = "0.12.1", features = ["cookie"] }
base64 = "0.22.1"
bytes = "1.10.1"
clap = { version = "4.5.40", features = ["derive"] }
dotenvy = "0.15.7"
futures-util = "0.3.32"
hmac = "0.12.1"
http = "1.3.1"
hyper = { version = "1.8.1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1.20", features = ["server-auto", "tokio"] }
reqwest = { version = "0.12.15", default-features = false, features = ["json", "rustls-tls", "stream"] }
rand = "0.8.5"
rustls = "0.23.37"
rustls-pki-types = "1.14.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
sqlx = { version = "0.8.5", default-features = false, features = ["runtime-tokio-rustls", "postgres", "migrate", "macros", "uuid", "json", "time"] }
thiserror = "2.0.12"
time = { version = "0.3.41", features = ["formatting", "parsing", "serde", "macros"] }
tokio = { version = "1.45.1", features = ["macros", "rt-multi-thread", "signal", "fs", "sync", "time"] }
tokio-rustls = "0.26.4"
toml = "0.8.20"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.2", features = ["compression-full", "fs", "normalize-path", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
url = "2.5.4"
uuid = { version = "1.16.0", features = ["v7", "serde"] }
