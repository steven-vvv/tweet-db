[app]
environment = "development"
base_url = "http://localhost:3001"

[server]
mode = "http"
listen_addr = "127.0.0.1:3001"
webui_dist_dir = "../../webui/dist"
# Relative certificate paths are resolved from this TOML file.
# Example:
# [server.tls]
# certificate_chain_path = "../../.cloudflare/origin-cert.pem"
# private_key_path = "../../.cloudflare/origin-key.pem"

[session]
cookie_name = "tweet_db_sid"
pending_login_cookie_name = "tweet_db_sso_state"
cookie_secure = false
ttl_hours = 12
absolute_ttl_hours = 720
auto_renew = true
pending_login_ttl_seconds = 600

[sso]
issuer = "http://localhost:3000"
client_id = "tweet-db"
login_redirect_uri = "http://localhost:3001/integrations/sso/callback"
authorization_cache_ttl_seconds = 300

[ingest]
max_items_per_batch = 5000
actor_metrics_min_interval_seconds = 86400
stats_sample_interval_seconds = 3600

[storage]
provider = "s3_compatible"
endpoint = "http://127.0.0.1:9000"
region = "us-east-1"
bucket = "tweet-db"
object_key_prefix = "media"
path_style = true

[transfer]
enabled = true
worker_count = 2
chunk_size_mb = 10
download_parallelism = 4
upload_parallelism = 4
max_in_flight_parts = 8
connect_timeout_seconds = 5
read_timeout_seconds = 30
attempt_timeout_seconds = 300
task_stale_timeout_seconds = 900
worker_poll_interval_seconds = 5
max_attempts = 8

[observability]
log_filter = "tweet_db_server=info,tower_http=info,sqlx=warn"
